spatial_cnn:
  max_epochs: 12
  early_stopping_epochs: 3
  batch_weeks: 4
  loss: Unweighted BCE on every eligible non-held-out train row; no negative sampling
  inputs: 21 strict features as weekly national grid; zero outside cells after train-only
    normalization
  architecture: 1x1 stem, GELU, 2/3 spatial 3x3 layers, 1x1 head plus linear center
    skip
  held_out_policy: Features may be context; held-out labels never loaded or fitted
  optimizer: AdamW; gradient norm clip 5; no mixed precision; deterministic CUDA
