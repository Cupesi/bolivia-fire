protocol_extension_version: "1.1"
registration_date: "2026-11-01"
status: registration_prepared_pending_coordinator_commit_and_runner_verification
classification: retrospective
parent:
  protocol: configs/protocol.yaml
  protocol_version: "1.1"
  protocol_sha256: 661b841c5dade7b8f0dab0787cc6916888b498ca13ef94f6b1272055c1644fbf
  experiments: configs/experiments.yaml
  experiments_sha256: a6eba3883044840843607bf42065b2f1ce363a9de5f2332b75edd7a706219d46
  amendment_scope: separate extension; no alteration of the published protocol or model
provenance:
  extension_sha256:
    algorithm: sha256
    input: exact bytes of configs/extension_vegetation.yaml
    record_at: registration before any extension training, selection, calibration, label access or metric
    self_hash_in_this_file: false
  registration:
    path: artifacts/evaluation/extension_registration.json
    document: docs/extension-vegetation.md
    required_fields: [registered_at_utc, contract_sha256, document_sha256, protocol_sha256, experiments_sha256, planned_runs, no_extension_labels_or_metrics_accessed]
    commit_required: true
    commit_owner: coordinator
    commit_timing: exact contract, document and registration bytes committed together before any extension training or selection
    commit_proof: runner verifies all three blobs in a retained Git commit; records that commit in each run artifact
    attestation: no extension labels or metrics accessed in this amendment and registration task; external access histories require separate audits
    runtime_guard:
      policy: fail closed; no override, unregistered fallback or automatic registration
      before: any label load, fitting, search, early stopping, calibration, scoring or bootstrap for any extension run
      required_checks:
        - registration exists, parses and has a valid UTC timestamp and no-access attestation
        - exact current YAML, document, parent protocol and experiments SHA-256 match the registered hashes
        - the registration, YAML and document have the required coordinator commit proof
        - requested run, ordered features, lag, geography and comparators match the registered run manifest
        - group availability, feature preflight and resource gates pass before labels are loaded
      refusal: missing or malformed record, mismatched hash, missing commit proof, unlisted run or failed gate exits without accessing labels or metrics
      implementation_gate: experiment code must implement this guard and demonstrate missing-record, changed-contract and uncommitted-record refusal before any extension execution
  selection_must_record:
    - registration file hash, coordinator commit proof and registered run identity
    - extension and parent protocol hashes
    - experiments hash and ordered sampled configurations
    - selected model and calibrator hashes, including published comparators
    - feature names, lag, quality thresholds and source collection identifiers
    - AppEEARS request identity, polygon hash, layer metadata and output checksums
    - source granule identifiers, production times and available release or ingest times
    - scaling verification and quality rejection counts
    - panel, cell grid, CHIRPS, outage and MapBiomas manifest hashes
    - feature snapshot hashes and ordered row-key hashes per stage and comparison
    - availability decisions, exclusion counts, seeds, environment and resource measurements
  change_rule: any substantive change requires a dated version and new committed registration before new fitting or metrics; retain exact prior contracts, documents, registrations, selections and all prior scores
  registration_retention: preserve each committed record under its contract hash before replacing the current record; never overwrite or reinterpret prior scores
  preceding_revision:
    version: "1.0"
    contract_sha256: 8516f0496431e843d04e772d658bc8b6c63846ace5631c0eb095f55ed63f2045
    document_sha256: 755e12f7845eba47d529e0b95eaf58008f6e44d34c77f012453e1c733a8fbb4b
    evidence: V13 independent protocol review, 2026-11-01

questions:
  H3:
    variant: retrospective_vegetation
    comparator: published_retrospective
    question: Does vegetation condition add calibrated average precision beyond strict FIRMS plus CHIRPS?
    requires: [vegetation]
  H4:
    variant: retrospective_land_cover
    comparator: published_retrospective
    question: Does previous-available-year land cover add calibrated average precision beyond the same baseline?
    requires: [zero_cost_mapbiomas_verification, land_cover_features]
    status: not_evaluated
    status_reason: anonymous access denied; zero-cost GEE verification and land-cover feature build not yet verified
    unavailable_result: not_evaluated
  H5:
    variant: retrospective_vegetation_land_cover
    comparator: published_retrospective
    question: Does the combination add calibrated average precision beyond the same baseline?
    requires: [vegetation, zero_cost_mapbiomas_verification, land_cover_features]
    status: not_evaluated
    status_reason: anonymous access denied; zero-cost GEE verification and land-cover feature build not yet verified
    unavailable_result: not_evaluated
  interpretation: predictive association; improvement is not assumed and effects are not causal

