  status: not_evaluated
  fit: separate 20-configuration selection and isotonic calibration
  selection_artifact: artifacts/evaluation/selection_extension_retrospective_vegetation_land_cover_geo_lag32.json

partitions:
  assignment: issue time; inherit parent boundary-crossing target purges
  train: ["2013-01-07", "2020-12-31"]
  val_select: ["2021-01-01", "2021-12-31"]
  val_calib: ["2022-01-01", "2022-12-31"]
  test: ["2023-01-01", "2025-12-31"]
  geographic_holdout:
    block_deg: 1.0
    fraction: 0.2
    seed: 20261031
    assignment: reuse frozen cell flags; sha256 ranking and floor(0.2 * unique block count)
    exclude_from: [fitting, selection, calibration, training_statistics]
  target: inherit any_detection_next_7d, primary confidence selection, UTC and seven-day observation rules
  eligibility:
    base: assigned non-purged row, finite binary label, correct geography, window_obs_complete_28d true
    rainfall: all five frozen values finite, corresponding completeness flags true, provenance verified
    retain_feature: window_obs_complete_365d
    exclude_low_coverage: false
    feature_missingness: drop required missing or non-finite values; never zero-fill
    availability_freeze: decide available groups from access and feature audits before extension metrics
    training: each extension uses base eligibility and complete required features; report support differences from the frozen baseline
    selection_and_calibration: common complete feature support across all available primary variants and both comparators
    evaluation: identical ordered intersection of eligible finite features and predictions for all compared variants
    unavailable_group: omit its variants from the intersection and report not_evaluated; do not null all other rows
    row_key: [cell_id, issue_date]
    counts_required:
      - scanned, purged, missing label, wrong geography, incomplete recent history
      - missing CHIRPS values or flags and invalid provenance
      - per-variant missing features, failed QA, stale observations, unavailable change reference or climatology
      - each variant's eligible rows before intersection and rows lost to the common intersection
      - final paired rows, positives, prevalence, represented months and row-key hash

estimation:
  family: lightgbm
  feature_construction: use each variant's exact ordered features below; temporal and geographic bases are distinct
  selection_scope: independent 20-configuration selection and calibration for every run_manifest fit; never transfer temporal selections to geographic fits or select between lags
  support_scope: compute common selection/calibration/evaluation support separately for temporal and geographic families; never compare a temporal extension to geographic comparators
  search:
    implementation: bolivia_fire.models.estimators.search_parameters
    seed: 7
    configurations: 20
    distinct: true
    reuse_order_across_variants: true
    space:
      num_leaves: [7, 15, 31, 63]
      learning_rate: [0.03, 0.06, 0.1]
      min_data_in_leaf: [50, 200, 1000]
      feature_fraction: [0.7, 0.85, 1.0]
      lambda_l2: [0, 1, 10]
    boosting_rounds: 400
    early_stopping_rounds: 30
    max_bin: 63
    num_threads: 4
    deterministic: true
    force_col_wise: true
    negative_sampling: none
    selection_metric: uncalibrated average_precision on val_select
    ties: model name, ascending
  calibration:
    method: isotonic
    partition: val_calib
    timing: after all configurations and tree counts are selected using val_select only
    out_of_bounds: clip
    probability_bounds: [0, 1]
    invalid_or_single_class: record identity fallback and reason; no positive extension decision
    comparator: reuse the published isotonic calibrator unchanged
  primary_decision:
    population: non-held-out val_calib common rows
    metric: calibrated step-wise average_precision
    contrast: extension minus published_retrospective
    bootstrap:
      implementation: bolivia_fire.evaluation.bootstrap.block_bootstrap
      blocks: UTC calendar year-month of issue_date
      replicates: 500
      seed: 7
      rng: numpy.random.default_rng
      paired: identical month multiplicities and rows for every compared variant
      interval: percentile [2.5, 97.5]
      undefined_draws: omit jointly undefined AP differences; report valid replicate count
      no_valid_draws: null interval and inconclusive decision
    adds_information: both interval endpoints finite and lower endpoint strictly greater than 0
    otherwise: inconclusive / no detected gain; never equivalence
    limitation: calibrators are fitted on these labels; intervals condition on fixed models and calibrators
    multiplicity: marginal hypothesis-specific intervals; no family-wise superiority claim or selection by these results
  secondary_metrics: [brier_score, log_loss, roc_auc, expected_calibration_error, recall_at_area_budget_5pct, recall_at_area_budget_10pct]
  secondary_definitions: inherit parent metric, area-budget, tie and undefined-subset rules

vegetation:
  product: MOD13A2.061
  doi: https://doi.org/10.5067/MODIS/MOD13A2.061
  spatial_resolution: native nominal 1 km sinusoidal pixels
  acquisition:
    service: AppEEARS area
    start: "2011-12-01"
    end: "2026-07-31"
    purpose: warm-up for changes; reference climatology remains training years only
    polygon: pinned Bolivia ADM0 buffered outward by 0.1 degree; verify it contains every intersecting 0.05-degree border cell
    output: GeoTIFF in native MODIS sinusoidal projection; no continuous-value interpolation
    layers:
      - 1_km_16_days_NDVI
      - 1_km_16_days_EVI
      - 1_km_16_days_VI_Quality
      - 1_km_16_days_pixel_reliability
      - 1_km_16_days_composite_day_of_the_year
    layer_identity: verify exact layer identifiers against the service product metadata before submission
    request_limits: split into sequential year requests only if service limits require; preserve identical polygon and layers
  quality:
    references: [mod13_user_guide, mod13_filespec]
    raw_ndvi_evi_valid_range: [-2000, 10000]
    raw_ndvi_evi_fill: -3000
    physical_ndvi_evi_valid_range: [-0.2, 1.0]
    physical_conversion: raw * 0.0001; offset 0
    vi_quality_valid_range: [0, 65534]
    vi_quality_fill: 65535
    reliability_valid_values: [0, 1, 2, 3]
    reliability_fill: -1
    reliability_accepted_values: [0]
    detailed_qa_accepted:
      modland_bits_0_1: [0]
      usefulness_bits_2_5: [0, 1, 2, 4]
      aerosol_bits_6_7: [1, 2]
      adjacent_cloud_bit_8: [0]
      brdf_correction_bit_9: [0, 1]
      mixed_cloud_bit_10: [0]
      land_water_bits_11_13: [1]
      snow_ice_bit_14: [0]
      shadow_bit_15: [0]
    composite_doy_valid_range: [1, 366]
    composite_doy_fill: -1
    composite_doy_rule: resolve to a real UTC date within the source granule period; reject impossible dates
    common_pixel_mask: NDVI, EVI, QA, reliability and observation date must all pass
    min_valid_pixel_area_fraction: 0.5
    denominator: geodesic area of the complete national portion of the cell, including rejected or missing pixels
    numerator: summed national pixel-cell intersection area passing the common mask
    below_threshold: all vegetation features missing, never zero
  scaling:
    reference: appeears_scaling
    expected_area_geotiff_storage: unscaled integers with scale and offset metadata; readers may auto-decode
    verify_before_features:
      - record service version, dtype, nodata, scale, offset and raw versus decoded reader mode
      - read raw values with automatic scaling disabled; verify product ranges and fill masks
      - compare non-fill pixel values with metadata-decoded values to float32 precision
      - require decoded = raw * 0.0001 and record whether the reader already applied it
      - reject conflicting or ambiguous metadata; magnitude alone cannot identify double scaling
    apply_conversion: exactly once; QA, reliability and DOY remain unscaled integers
  aggregation:
    support: native pixel footprint intersected with cell and ADM0; border buffer is acquisition only
    weighting: geodesic WGS84 intersection area; sum(weight * physical index) / sum(valid weight)
    common_support: same accepted pixels for NDVI and EVI within each composite
  temporal:
    period: metadata start through end inclusive; implement end boundary as next UTC midnight
    rule: end_boundary + availability_lag_days <= issue_time
    availability_lag_days: 16
    lag_evidence: no MOD13A2-specific guaranteed publication latency established from the cited primary pages
    lag_interpretation: conservative simulation assumption; MODAPS L1/L2 latency is not MOD13A2 latency
    historical_production_timestamp_gate: false
    historical_gate_reason: reprocessed vintages can postdate issue time; no operational-availability claim
    latest: greatest composite end passing availability, QA, coverage and age gates for the cell
    observation_age_days: issue_time minus latest contributing pixel observation date, in fractional UTC days
    max_current_observation_age_days: 64
    age_gate: every contributing pixel observation must be no older than the maximum
    max_change_reference_observation_age_days: 128
    interpolation: none; no future composite, centered interpolation, generic forward/backfill or backward use of later observations
    provenance: retain period bounds, oldest and latest contributing dates and actual age alongside features
  features:
    latest: [veg_ndvi_latest, veg_evi_latest]
    previous_change: [veg_ndvi_change_previous, veg_evi_change_previous]
    previous_rule: latest minus immediately previous valid available composite; start-date gap at most 32 days
    change_48d: [veg_ndvi_change_48d, veg_evi_change_48d]
    change_48d_rule: latest minus valid available composite nearest latest start minus 48 days, tolerance 8 days; earlier wins ties
    anomaly: [veg_ndvi_seasonal_anomaly, veg_evi_seasonal_anomaly]
    anomaly_rule: latest minus arithmetic training-reference mean for the same composite-of-year slot; no variance scaling
    quality_and_age: [veg_valid_pixel_fraction, veg_observation_age_days]
    required: all ten features finite; missing reference makes the variant row unavailable
  climatology:
    reference_years: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
    slot: min((day_of_year(composite_start) - 1) // 16, 22)
    train_cross_fitting: exclude the issue calendar year; other training years, including later ones, permitted
    later_rows: all and only reference years
    excluded: geographic holdout observations, validation/test/confirmation years and warm-up-only years
    temporal_reference: cell by composite slot, equally weighted valid annual cell composites
    geographic_reference: department by composite slot, equal weight per non-held-out cell within each year then equal years
    reference_quality_scope: QA and coverage in each reference composite's own period; current-issue age gate does not apply to historical reference years
    min_distinct_reference_years: 4
    missing_reference: null anomaly; no validation or test backfill
  longer_lag_sensitivity:
    availability_lag_days: 32
    status: pre-specified sensitivity, not an alternative primary or a way to rescue a decision
    fitting: separate 20-configuration search with identical space and seeds; same calibration procedure
    rows: report sensitivity support and an additional primary-versus-sensitivity common-support comparison
    other_rules: unchanged, including current age limit; report increased missingness

land_cover:
  product: MapBiomas Bolivia Collection 4
  classification: retrospective; reference year is not release year
  access:
    requirement: lawful official access verified by a separate task, strictly zero-cost Community Tier GEE or verified anonymous provider download; no private assets or access-control bypass
    owner_authorization: authenticated Google Earth Engine use authorized only under strict zero-cost Community Tier conditions
    existing_status: anonymous GeoTIFF ranged GET returned HTTP 403 for 2012, 2018, 2024 and 2025 on 2026-11-01
    existing_evidence: research_mapbiomas_access.md; retained external access report dated 2026-11-01
    existing_evidence_sha256: cfb7929f3fafd13a90aba88ef0a26f45055ffe68225810a847f019a58cbd3539
    earlier_evidence: datasets/processed/covariates/probe_mapbiomas.json; 2026-10-31
    gee_route:
      status: conditional_pending_separate_verification
      asset: projects/mapbiomas-public/assets/bolivia/lulc/collection4/mapbiomas_bolivia_collection4_coverage_v1
      separate_task_must_verify: [zero_cost_Community_Tier, authenticated_access, collection_and_year_identity, legend, licence_and_attribution]
      cost_rule: verify no charges for compute, export or destination storage; no paid tier, billing activation or billable fallback; stop if zero cost cannot be established
      execution_here: none; authorization alone does not establish access, zero cost or feature availability
    unblock: separate verification passes and land-cover features are built, audited and frozen before any availability decision or extension metric
    availability_change_after_metrics: requires a new dated committed registration; no post-score addition to the common support
    new_audit: record provider URL or GEE asset, access mode, zero-cost evidence, status, metadata, licence, legend, collection, year, checksum and date before feature evaluation
    failure: H4 and H5 not_evaluated with reason; no substitute collection or silent group omission
  reference_year: greatest map year accessible at extraction with map year <= issue year - 1; nominally issue year - 1
  historical_availability: extraction-time accessibility and one-year map lag do not establish release or availability at historical issue time
  future_year_filtering: Collection 4 temporal gap filling and smoothing can use future map years; a one-year map lag does not remove this information
  max_reference_age_years: 2
  nominal_map_year_range: {first: 2012, last: 2025, endpoints: inclusive}
  optional_fallback_map_year_first: 2011
  year_provenance: record actual selected year and nominal year for every cell-issue; no future-year maps
  area_weights: national native-pixel-cell intersection areas; no categorical interpolation
  denominator: total mapped area in the national cell portion
  min_mapped_area_fraction: 0.95
  invalid_codes: nodata, unobserved class 27, or codes outside the five declared groups
  invalid_rule: exclude from mapped denominator; below coverage threshold makes all fractions missing
  valid_fraction_bounds: [0, 1]
  sum_rule: five fractions sum to 1 within 1e-6; reject otherwise
  classes:
    forest: [1, 3, 4, 6]
    nonforest: [10, 11, 12, 13, 29, 63, 66, 77, 81, 82]
    farming: [14, 15, 18, 21, 39, 40, 72]
    nonvegetated: [22, 23, 24, 25, 30, 61, 68, 92]
    water: [26, 31, 33, 34]
  legend_rule: validate against the pinned Collection 4 legend before extraction; mismatch blocks H4/H5
  features: [mapbiomas_forest_fraction, mapbiomas_nonforest_fraction, mapbiomas_farming_fraction, mapbiomas_nonvegetated_fraction, mapbiomas_water_fraction]

test_access:
  published_log: artifacts/evaluation/final_test_log.json
  observed_entries_at_registration: 7
  entry_roles: {primary: 1, sensitivity_reopenings: 5, post_hoc_comparison: 1}
  interpretation: post-hoc comparison has reopening false in its own namespace; the test is nevertheless previously inspected
  extension_scoring: exploratory logged reopening only; never tuning or changing the published model
  required_reason: exploratory vegetation/land-cover extension on previously opened 2023-2025 test; frozen selection
  log_before_labels: true
  log_before_scoring: true
  log_timing: append and durably retain the exploratory opening before label access or scoring, including geographic and sensitivity runs; abort if logging fails
  attempt_record: log planned runs, ordered row-key hashes, registration hash and commit proof; append completion or failure without deleting the opening
  require: explicit open flag, nonempty reopen reason and immutable extension/model/calibrator/panel hashes

fresh_confirmation:
  preregister: true
  role: supplementary once-only temporal confirmation; primary extension decision remains val_calib
  issue_first: "2026-01-05"
  issue_last: "2026-07-20"
  issue_calendar: Monday 00:00 UTC, endpoints inclusive
  target: same seven-day primary FIRMS SP detection target; last target ends 2026-07-27 exclusive
  firms_acquisition_end: "2026-07-31"
  vegetation_archive_cutoff: "2026-07-31T23:59:59Z"
  population: all eligible non-held-out national cells, same grid, coverage and common-support rules
  fitting_or_recalibration: none on 2026 rows
  prerequisites:
    - document an access audit attesting that no 2026 confirmation labels, outcome summaries or scores were inspected for development
    - freeze extension contract, available variants, models, calibrators, manifests and row-support rules before label access
    - extend FIRMS SP observations and documented outage coverage through 2026-07-31; retain existing history
    - extend unchanged CHIRPS definitions through the final antecedent day, 2026-07-19
    - accept only MOD13A2 granules evidenced as produced and archived by the vegetation archive cutoff, also passing end-plus-lag gates
    - if archive availability cannot be established, mark affected features missing rather than assume early availability
  preregistration_integrity_failure: mark confirmation unavailable; do not claim an untouched window or choose another window after scores
  scoring:
    maximum_label_openings: 1
    schedule: one logged batch after selection; include every available temporal hypothesis, its 32-day sensitivity and fixed temporal subgroups; geographic runs remain exploratory on the registered holdout
    log_timing: append and durably retain the single batch opening before label access or scoring; abort if logging fails
    failed_after_label_access: consumes the opening; any retry is exploratory and cannot restore confirmation status
    inference: same 500 paired calendar-month replicates and seed 7; fixed models and calibrators
    agreement: same hypothesis has finite AP difference interval with lower endpoint strictly above 0
    undefined_or_nonpositive_interval: inconclusive / no detected gain; no equivalence or confirmation claim
  prevalence_caveat: January to July 20 omits August-October and most of the full July-October dry-season subgroup; prevalence may be lower and AP is not directly comparable across windows

exploratory_subgroups:
  fixed_before_scoring:
    santa_cruz: existing santa_cruz cell flag, computed with the pinned ADM1 definition
    dry_season: issue UTC month in [7, 8, 9, 10]
    santa_cruz_dry_season: intersection of the two fixed definitions
    geographic_holdout: same held-out blocks with corresponding geo models; never fitting labels
  reports: common rows, exclusions, positives, prevalence, AP and paired differences
  uncertainty: calendar-month blocks for temporal subgroups; 1-degree spatial blocks for geographic holdout; 500 replicates, seed 7
  restrictions: no subgroup-specific selection, calibration, thresholds, primary decisions or confirmatory claims

promotion:
  replace_live_or_published_model: false
  future_study_proposal_only: corresponding validation interval entirely above 0 and corresponding fresh confirmation interval entirely above 0
  confirmation_unavailable_or_inconclusive: no promotion proposal under this contract
  full_fire_season_claim: requires a future separately registered untouched seasonal study

resources:
  disk_free_floor_gib: 55
  extension_disk_budget_gib: 30
  accounting: GiB = 1024^3 bytes, matching the existing free-space guard
  memory_limit_gib: 12
  memory_measurement:
    scope: summed resident RAM of the entire process tree, including download, aggregation, fitting and bootstrap child processes
    sample_interval_seconds: 1
    record: per-stage peak process-tree RSS bytes and timestamps; all temporal, geographic and sensitivity fits
    enforce: check projected allocations and measured process-tree RAM; checkpoint and stop before the 12-GiB limit; stop if monitoring fails
  download_parallelism: 1
  fitting_parallelism: 1
  batch_rows: 100000
  enforce: projected post-allocation free space must remain >=55 GiB; extension peak disk <=30 GiB
  retention: process windows sequentially; preserve metadata/checksums and compact cell features; remove only owned verified intermediates
  insufficient_resources: checkpoint and stop before crossing limits; no silent date/layer/QA reduction
  runtime_estimates:
    status: planning estimates, not measured; provider queue and transfer rate unknown
    appeears_queue_and_extract_hours: [6, 72]
    transfer_and_aggregation_hours: [2, 24]
    search_calibration_and_bootstrap_hours_per_variant: [1, 12]
    measurement_required: record actual bytes, elapsed stage times, peak process-tree RAM and minimum free disk

