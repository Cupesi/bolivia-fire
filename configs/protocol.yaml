# Evaluation protocol for the Bolivia Fire weekly detection benchmark.
# Frozen before any model optimization. Changes after freezing must be recorded in
# docs/protocol.md under "Amendments" with a date and reason.
protocol_version: "1.0"

target:
  name: any_detection_next_7d
  definition: >-
    1 if at least one selected FIRMS VIIRS S-NPP standard-processing detection falls inside
    the national part of the cell during [issue_time, issue_time + 7 days), else 0.
    Not a count of fires, ignitions, burned area, or an official warning.
  source_product: VIIRS_SNPP_SP
  timezone: UTC
  issue_weekday: Monday
  issue_time: "00:00:00"
  horizon_days: 7
  interval_closure: "[start, end)"

selection:
  primary:
    type: [0]                 # presumed vegetation fire
    confidence: [n, h]        # nominal, high
  sensitivity:
    all_confidence:
      type: [0]
      confidence: [l, n, h]
  deduplication: exact duplicate rows across all source columns

study_area:
  country: Bolivia
  boundary: geoBoundaries gbOpen BOL ADM0 (pinned in datasets/sources.yaml)
  subregion_report: Santa Cruz department (geoBoundaries gbOpen BOL ADM1)
  acquisition_bbox: [-70, -23, -57, -9]   # west, south, east, north
  point_inclusion: point covered by ADM0 polygon (boundary points included)

grid:
  crs: "EPSG:4326"
  resolution_deg: 0.05
  origin: [-180.0, -90.0]     # cell edges at integer multiples of 0.05 deg
  cell_closure: "[west, east) x [south, north)"
  col_index: "floor((lon + 180) / 0.05)"
  row_index: "floor((lat + 90) / 0.05)"
  eligibility: cell intersects the ADM0 polygon with positive area
  cell_area: geodesic WGS84 area of the cell part inside ADM0 (km2)

time:
  acquisition_start: "2012-01-20"   # first available VIIRS_SNPP_SP date; feature warm-up
  acquisition_end: "2026-01-04"     # inclusive; covers the target of the last 2025 issue week
  first_issue: "2013-01-07"
  last_issue: "2025-12-29"

partitions:
  # Assignment by issue_time. Rows whose target interval crosses a partition boundary are purged.
  train: ["2013-01-07", "2020-12-31"]
  val_select: ["2021-01-01", "2021-12-31"]   # model selection and early stopping
  val_calib: ["2022-01-01", "2022-12-31"]    # probability calibration only
  test: ["2023-01-01", "2025-12-31"]         # final test; opened once after selection is closed
  geographic_holdout:
    block_deg: 1.0
    fraction: 0.2
    seed: 20261031
    rule: >-
      1-degree blocks (integer-degree edges) ranked by sha256("{seed}:{block_id}");
      the lowest 20% are held out of all fitting, selection and calibration.
      Reported on the test years as a spatiotemporal test.

features:
  information_rule: features use only observations with acquisition time < issue_time
  strict:
    description: FIRMS-derived features; assumes NRT detections at issue time match SP detections
    groups: [cell_history, neighborhood_history, recency, seasonality, train_climatology]
  retrospective:
    description: strict features plus covariates whose historical vintages were not available at issue time
    groups: [chirps_v3_antecedent_rainfall, mapbiomas_previous_year_land_cover]
  climatology:
    fit_years: train partition only
    training_rows: leave-one-year-out
    smoothing_weeks: 2

models:
  baselines: [train_climatology, persistence]
  candidates: [logistic_regression, lightgbm]
  training_negative_sampling:
    logistic_regression: {negative_fraction: 0.1, reweight: true}
    lightgbm: none
  lightgbm_search:
    method: random
    configurations: 20
    seed: 7
    selection_metric: average_precision on val_select
  calibration: isotonic regression fit on val_calib

metrics:
  primary: average_precision     # sklearn step-wise AP over all eligible cell-weeks
  secondary: [brier_score, log_loss, roc_auc, recall_at_area_budget_5pct, recall_at_area_budget_10pct, expected_calibration_error]
  area_budget: >-
    For each issue week, rank cells by predicted probability and select from the top until the
    cumulative national cell area reaches the budget share of national area; recall is the share
    of positive cell-weeks selected, pooled over weeks.
  uncertainty:
    temporal: block bootstrap over calendar months, 500 replicates
    spatial: block bootstrap over 1-degree blocks, 500 replicates (geographic holdout)
  undefined_metric_rule: report as null with the reason (e.g. single-class subset)

final_test_access:
  rule: >-
    Test metrics are computed only by the evaluation command with an explicit open flag; every
    opening is appended to artifacts/evaluation/final_test_log.json with the protocol hash.
