schema_version: '1.0'
variant: retrospective
chirps:
  product: CHIRPS v3.0 final daily rnl
  disaggregation: ERA5
  precipitation_units: mm/day
  native_pixel_size_deg: 0.05000000074505806
  bbox: [-70, -23, -57, -9]
  daily_output: datasets/processed/covariates/chirps_daily/year=YYYY/part.npz
  daily_keys: [dates, rain, transform]
  feature_output: datasets/processed/covariates/chirps_features/year=YYYY/part.parquet
  primary_key: [cell_id, issue_date]
  columns:
    cell_id: string
    issue_date: timestamp[ns]
    rain_sum_7d: {type: float32, unit: mm, window: '[issue-7d, issue)'}
    rain_sum_30d: {type: float32, unit: mm, window: '[issue-30d, issue)'}
    rain_sum_90d: {type: float32, unit: mm, window: '[issue-90d, issue)'}
    dry_days_30d: {type: float32, unit: days, threshold: 'precipitation < 1 mm'}
    rain_anomaly_90d: {type: float32, unit: ratio, reference: complete train-year windows only}
    rain_complete_7d: bool
    rain_complete_30d: bool
    rain_complete_90d: bool
    rain_climatology_years: int16
    rain_climatology_complete: bool
  missing: 'NaN, represented as Arrow null in feature Parquet; never zero-filled'
mapbiomas:
  collection: 4
  live_status: unavailable_http_403
  output: datasets/processed/covariates/mapbiomas_fractions.parquet
  primary_key: [cell_id, year]
  feature_rule: issue year Y joins land-cover year Y-1
  denominator: valid pixel centers assigned to the cell
  columns:
    cell_id: string
    year: int64
    mapbiomas_valid_pixels: int64
    mapbiomas_forest_fraction: float32
    mapbiomas_nonforest_fraction: float32
    mapbiomas_farming_fraction: float32
    mapbiomas_nonvegetated_fraction: float32
    mapbiomas_water_fraction: float32
    mapbiomas_other_fraction: float32
  classes:
    forest: [1, 3, 4, 6]
    nonforest: [10, 11, 12, 13, 29, 63, 66, 77, 81, 82]
    farming: [14, 15, 18, 21, 39, 40, 72]
    nonvegetated: [22, 23, 24, 25, 30, 61, 68, 92]
    water: [26, 31, 33, 34]
    other: all other finite non-nodata codes, including unobserved class 27
